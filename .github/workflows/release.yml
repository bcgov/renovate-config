name: CalVer Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2026.9.0, 2026.9.1)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      - name: Validate CalVer version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "Using manual release version: $VERSION"

          # Validate version format (expected YYYY.M.Patch, no leading single-digit month zeroes, requires 3 segments)
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "❌ ERROR: Version '$VERSION' is not a valid SemVer-compatible CalVer format!"
            echo "   Expected YYYY.M.Patch (e.g., 2026.9.0) with no leading zero in the month segment."
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Verify release and tag are unique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh release list --json tagName --jq '.[] | select(.tagName=="'$VERSION'").tagName')" ]; then
            echo "ERROR: Release $VERSION already exists!"
            exit 1
          fi
          echo "Release $VERSION is available"

          if [ -n "$(git tag -l "$VERSION")" ]; then
            echo "ERROR: Tag $VERSION already exists!"
            exit 1
          fi
          echo "Tag $VERSION is available"

      - name: Create CalVer tag
        run: |
          git tag -a "$VERSION" -m "Release $VERSION - CalVer release"
          git push origin "$VERSION"
          echo "Created and pushed tag: $VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --title "Release $VERSION" --generate-notes

      - name: Verify release
        run: |
          echo "Verifying created release:"
          echo "Tag: $VERSION"
          echo "All tags:"
          git tag -l | sort -V
